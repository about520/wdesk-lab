name: Windows 免费机

# 点 Actions → Windows 免费机 → Run workflow，1-2 分钟后给你一台
# Windows Server 2022（4 核 / 16G 内存 / 14G 盘）：
#   ① 浏览器直接打开就是桌面（noVNC，手机电脑都行，不用装任何东西）
#   ② 也可以用自己的「远程桌面连接」mstsc 连（走 bore 免费端口映射）
# 最长约 5 小时 50 分，到点整机自动销毁。

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '存活分钟数（1-350，默认 180）'
        required: false
        default: '180'
      password:
        description: '登录密码（留空自动生成）'
        required: false
        default: ''
      topic:
        description: '内部通道（留空不推送）'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: windows-box
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - name: 1. 设置账号密码 + 打开远程桌面
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $pw = "${{ github.event.inputs.password }}".Trim()
          if ([string]::IsNullOrWhiteSpace($pw)) {
            $chars = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"
            $pw = -join (1..14 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $min = 180
          [int]::TryParse("${{ github.event.inputs.minutes }}", [ref]$min) | Out-Null
          if ($min -lt 1)   { $min = 180 }
          if ($min -gt 350) { $min = 350 }

          New-Item -ItemType Directory -Force -Path "C:\winbox" | Out-Null

          "BOX_PW=$pw"        | Add-Content -Path $env:GITHUB_ENV
          "BOX_MIN=$min"      | Add-Content -Path $env:GITHUB_ENV
          "BOX_TMP=C:\winbox" | Add-Content -Path $env:GITHUB_ENV
          "BOX_TOPIC=${{ github.event.inputs.topic }}".Trim() | Add-Content -Path $env:GITHUB_ENV

          net user runneradmin "$pw" | Out-Null

          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name UserAuthentication -Value 0
          netsh advfirewall firewall add rule name="RDP-3389" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          netsh advfirewall firewall add rule name="VNC-5900" dir=in action=allow protocol=TCP localport=5900 | Out-Null
          netsh advfirewall firewall add rule name="WEB-6080" dir=in action=allow protocol=TCP localport=6080 | Out-Null
          Set-Service -Name TermService -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service TermService -ErrorAction SilentlyContinue

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows 免费机"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "账号：``runneradmin``　密码：``$pw``　存活：$min 分钟"
          Write-Host "账号 runneradmin 密码已设置，远程桌面已开启"

      - name: 2. 装 VNC 服务（服务端在 5900 端口）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $msi = "$env:BOX_TMP\tightvnc.msi"
          $urls = @(
            "https://www.tightvnc.com/download/2.8.84/tightvnc-2.8.84-gpl-setup-64bit.msi",
            "https://download.tightvnc.com/tightvnc-2.8.84-gpl-setup-64bit.msi"
          )
          foreach ($u in $urls) {
            if (Test-Path $msi) { break }
            try {
              Invoke-WebRequest -Uri $u -OutFile $msi -UseBasicParsing -TimeoutSec 180
              Write-Host "下载成功：$u"
            } catch { Write-Host "下载失败：$u" }
          }

          if (-not (Test-Path $msi)) {
            Write-Host "改用包管理器安装"
            choco install tightvnc -y --no-progress 2>&1 | Select-Object -Last 3 | Write-Host
          } else {
            $argline = "/i `"$msi`" /qn /norestart " +
              "ADDLOCAL=Server " +
              "SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 " +
              "SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:BOX_PW " +
              "SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1 " +
              "SET_SERVICE=1 VALUE_OF_SERVICE=1 " +
              "SET_MIRRORDRIVER=0 VALUE_OF_MIRRORDRIVER=0 " +
              "SET_RUNCONTROLINTERFACE=0"
            Start-Process msiexec.exe -ArgumentList $argline -Wait
          }

          Start-Sleep -Seconds 8
          $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
          if ($svc) {
            if ($svc.Status -ne "Running") { Start-Service tvnserver -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 4
          }
          $listen = Get-NetTCPConnection -LocalPort 5900 -State Listen -ErrorAction SilentlyContinue
          Write-Host "5900 监听：$([bool]$listen)"
          "VNC_OK=$(if ($listen) { '1' } else { '0' })" | Add-Content -Path $env:GITHUB_ENV
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "VNC 服务：$(if ($listen) { '已就绪' } else { '未就绪' })"

      - name: 3. 起网页桌面 + 公网入口，并保持在线
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $T = "$env:BOX_TOPIC"
          function Publish($m) {
            if (-not $T) { return }
            try { Invoke-RestMethod -Method Post -Uri "https://ntfy.sh/$T" -Body $m -TimeoutSec 25 | Out-Null } catch {}
          }
          function GrabUrl($f, $pat) {
            if (-not $f -or -not (Test-Path $f)) { return "" }
            $x = Select-String -Path $f -Pattern $pat -AllMatches | Select-Object -Last 1
            if ($x) { return $x.Matches[0].Value }
            return ""
          }

          # ---------- noVNC ----------
          $nv = "$env:BOX_TMP\novnc"
          if (-not (Test-Path "$nv\vnc.html")) {
            try {
              Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile "$env:BOX_TMP\novnc.zip" -UseBasicParsing -TimeoutSec 240
              Expand-Archive -Path "$env:BOX_TMP\novnc.zip" -DestinationPath "$env:BOX_TMP\nvx" -Force
              $src = Get-ChildItem "$env:BOX_TMP\nvx" -Directory | Select-Object -First 1
              New-Item -ItemType Directory -Force -Path $nv | Out-Null
              Copy-Item "$($src.FullName)\*" $nv -Recurse -Force
            } catch { Write-Host "noVNC 下载失败" }
          }
          Write-Host "noVNC 就绪：$(Test-Path "$nv\vnc.html")"

          python -m pip install --quiet --disable-pip-version-check --upgrade websockify 2>&1 | Select-Object -Last 2 | Write-Host

          $script:WS = $null
          function Start-WS {
            if ($script:WS) { Stop-Process -Id $script:WS.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
            $o = "$env:BOX_TMP\ws.out"; $e = "$env:BOX_TMP\ws.err"
            Remove-Item $o, $e -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath "python" `
              -ArgumentList @("-m", "websockify", "--web", $nv, "6080", "localhost:5900") `
              -RedirectStandardOutput $o -RedirectStandardError $e -WindowStyle Hidden -PassThru
            $script:WS = $p
            return $p
          }
          function Test-Local {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:6080/vnc.html" -UseBasicParsing -TimeoutSec 8
              return ($r.StatusCode -eq 200)
            } catch { return $false }
          }

          $null = Start-WS
          $localOk = $false
          for ($i = 0; $i -lt 12; $i++) { Start-Sleep -Seconds 3; if (Test-Local) { $localOk = $true; break } }
          Write-Host "本机网页服务：$localOk"
          if (-not $localOk) {
            $tail = ""
            if (Test-Path "$env:BOX_TMP\ws.err") { $tail = (Get-Content "$env:BOX_TMP\ws.err" -Tail 5 | Out-String) -replace "\s+", " " }
            Publish "ERR weblocal=false $tail"
          }

          # ---------- cloudflared ----------
          $cf = "$env:BOX_TMP\cloudflared.exe"
          if (-not (Test-Path $cf)) {
            try {
              Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cf -UseBasicParsing -TimeoutSec 240
            } catch { Write-Host "cloudflared 下载失败" }
          }

          $script:CF = $null
          $script:CFLOG = "$env:BOX_TMP\cf.log"
          $script:CFERR = "$env:BOX_TMP\cf.err"
          $script:URL = ""
          function Start-CF {
            if ($script:CF) { Stop-Process -Id $script:CF.Id -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1 }
            Remove-Item $script:CFLOG, $script:CFERR -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $cf `
              -ArgumentList @("tunnel", "--url", "http://127.0.0.1:6080", "--no-autoupdate", "--protocol", "http2", "--edge-ip-version", "4", "--logfile", $script:CFLOG) `
              -RedirectStandardError $script:CFERR -WindowStyle Hidden -PassThru
            $script:CF = $p
            $u = ""
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 3
              $u = GrabUrl $script:CFLOG "https://[a-z0-9-]+\.trycloudflare\.com"
              if (-not $u) { $u = GrabUrl $script:CFERR "https://[a-z0-9-]+\.trycloudflare\.com" }
              if ($u) { break }
            }
            $script:URL = $u
            return $u
          }
          function Test-Tunnel($u) {
            if (-not $u) { return $false }
            for ($i = 0; $i -lt 8; $i++) {
              Start-Sleep -Seconds 4
              try {
                $r = Invoke-WebRequest -Uri "$u/vnc.html" -UseBasicParsing -TimeoutSec 15
                if ($r.StatusCode -eq 200) { return $true }
              } catch {}
            }
            return $false
          }

          $url = ""
          if (Test-Path $cf) {
            $url = Start-CF
            Write-Host "隧道地址：$url"
            if (-not (Test-Tunnel $url)) {
              Write-Host "首条隧道没通，重开一条"
              $url = Start-CF
              $null = Test-Tunnel $url
            }
          }
          $cfTail = ""
          if (Test-Path $script:CFERR) { $cfTail = (Get-Content $script:CFERR -Tail 4 | Out-String) -replace "\s+", " " }
          if ($cfTail.Length -gt 300) { $cfTail = $cfTail.Substring(0, 300) }

          # ---------- bore（备用：远程桌面 / 网页） ----------
          $rdp = ""; $web2 = ""
          $bore = "$env:BOX_TMP\bore\bore.exe"
          if (-not (Test-Path $bore)) {
            try {
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest" -Headers @{ "User-Agent" = "zaka" } -TimeoutSec 60
              $asset = $rel.assets | Where-Object { $_.name -like "*windows-msvc.zip" } | Select-Object -First 1
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:BOX_TMP\bore.zip" -UseBasicParsing -TimeoutSec 180
              Expand-Archive -Path "$env:BOX_TMP\bore.zip" -DestinationPath "$env:BOX_TMP\bore" -Force
            } catch { Write-Host "bore 下载失败" }
          }
          $script:B1 = $null; $script:B2 = $null
          if (Test-Path $bore) {
            try {
              $o1 = "$env:BOX_TMP\b3389.out"; $e1 = "$env:BOX_TMP\b3389.err"
              Remove-Item $o1, $e1 -ErrorAction SilentlyContinue
              $script:B1 = Start-Process -FilePath $bore -ArgumentList @("local", "3389", "--to", "bore.pub") -RedirectStandardOutput $o1 -RedirectStandardError $e1 -WindowStyle Hidden -PassThru
              for ($i = 0; $i -lt 10; $i++) { Start-Sleep -Seconds 3; $rdp = GrabUrl $o1 "bore\.pub:\d+"; if (-not $rdp) { $rdp = GrabUrl $e1 "bore\.pub:\d+" }; if ($rdp) { break } }

              $o2 = "$env:BOX_TMP\b6080.out"; $e2 = "$env:BOX_TMP\b6080.err"
              Remove-Item $o2, $e2 -ErrorAction SilentlyContinue
              $script:B2 = Start-Process -FilePath $bore -ArgumentList @("local", "6080", "--to", "bore.pub") -RedirectStandardOutput $o2 -RedirectStandardError $e2 -WindowStyle Hidden -PassThru
              for ($i = 0; $i -lt 10; $i++) { Start-Sleep -Seconds 3; $web2 = GrabUrl $o2 "bore\.pub:\d+"; if (-not $web2) { $web2 = GrabUrl $e2 "bore\.pub:\d+" }; if ($web2) { break } }
            } catch {}
          }

          $entry = @{ url = "$url"; url2 = "$web2"; rdp = "$rdp"; pw = "$env:BOX_PW"; local = "$localOk" } | ConvertTo-Json -Compress
          Publish $entry
          if (-not $url) { Publish "ERR notunnel $cfTail" }
          Write-Host "入口：$entry"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          if ($url) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ① 浏览器网页桌面`n$url/vnc.html?autoconnect=1&resize=scale&reconnect=1" }
          if ($web2) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 备用网页入口`nhttp://$web2/vnc.html?autoconnect=1&resize=scale" }
          if ($rdp) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ② 远程桌面 mstsc`n$rdp" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`n账号：``runneradmin``　密码：``$env:BOX_PW``"

          # ---------- 常驻 ----------
          $min = [int]$env:BOX_MIN
          $end = (Get-Date).AddMinutes($min)
          $lastBeat = Get-Date
          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 40

            if (-not (Test-Local)) {
              Write-Host "网页服务掉了，重启"
              $null = Start-WS
              Start-Sleep -Seconds 5
            }

            $cfDead = $true
            if ($script:CF) { $cfDead = -not [bool](Get-Process -Id $script:CF.Id -ErrorAction SilentlyContinue) }
            if ($cfDead) {
              Write-Host "隧道掉了，重开"
              $u = Start-CF
              if (Test-Tunnel $u) {
                Publish "newurl $u"
                Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "新入口 $(Get-Date -Format 'HH:mm:ss')：$u/vnc.html?autoconnect=1&resize=scale"
              }
            }

            $svc = Get-Service tvnserver -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne "Running") { Start-Service tvnserver -ErrorAction SilentlyContinue }

            if (((Get-Date) - $lastBeat).TotalMinutes -ge 10) {
              $lastBeat = Get-Date
              Publish "alive $((Get-Date).ToString('HH:mm'))"
            }
          }
          Write-Host "到点了，机器收工"
